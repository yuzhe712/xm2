name: intelliticket

x-backend-environment: &backend-environment
  APP_ENV: production
  DATA_MODE: ${DATA_MODE:-mock}
  DATABASE_URL: postgresql+psycopg://intelliticket:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/intelliticket
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
  BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-系统管理员}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_QUEUE_NAME: celery
  ATTACHMENT_STORAGE_DIR: /app/data/attachments
  ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
  FRONTEND_ALLOWED_ORIGINS: '${FRONTEND_ALLOWED_ORIGINS:-["http://localhost:8080"]}'
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DINGTALK_ENABLED: ${DINGTALK_ENABLED:-false}
  DINGTALK_OPERATOR_WEBHOOK_URL: ${DINGTALK_OPERATOR_WEBHOOK_URL:-}
  DINGTALK_EMPLOYEE_WEBHOOK_URL: ${DINGTALK_EMPLOYEE_WEBHOOK_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intelliticket
      POSTGRES_USER: intelliticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliticket -d intelliticket"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - attachments:/app/data/attachments
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - attachments:/app/data/attachments
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - intelliticket_backend.worker:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - attachments:/app/data/attachments
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        ELECTRON_MIRROR: ${ELECTRON_MIRROR:-https://npmmirror.com/mirrors/electron/}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backup:
    profiles: ["maintenance"]
    image: postgres:16-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      DATABASE_URL: postgresql://intelliticket:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/intelliticket
      BACKUP_ROOT: /backups
      ATTACHMENT_STORAGE_DIR: /attachments
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - attachments:/attachments:ro
    restart: "no"

  restore:
    profiles: ["maintenance"]
    image: postgres:16-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "exec /bin/sh /scripts/restore.sh \"$$RESTORE_SOURCE\""]
    environment:
      DATABASE_URL: postgresql://intelliticket:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/intelliticket
      ATTACHMENT_STORAGE_DIR: /attachments
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-NO}
      RESTORE_SOURCE: ${RESTORE_SOURCE:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - attachments:/attachments
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  attachments:
